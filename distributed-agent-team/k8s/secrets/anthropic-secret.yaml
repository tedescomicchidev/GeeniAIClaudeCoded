# Anthropic API Key Secret
# IMPORTANT: Replace YOUR_API_KEY_HERE with your actual API key before applying
# The key must be base64 encoded: echo -n "sk-ant-xxx" | base64
#
# To apply with your key:
#   export ANTHROPIC_API_KEY="sk-ant-xxx"
#   kubectl create secret generic anthropic-api-key \
#     --from-literal=api-key=$ANTHROPIC_API_KEY \
#     -n agents
#   kubectl create secret generic anthropic-api-key \
#     --from-literal=api-key=$ANTHROPIC_API_KEY \
#     -n dmz
---
# Secret for agents namespace (backend pods)
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  namespace: agents
type: Opaque
stringData:
  api-key: "YOUR_API_KEY_HERE"
---
# Secret for dmz namespace (frontend pod, if needed for direct SDK calls)
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  namespace: dmz
type: Opaque
stringData:
  api-key: "YOUR_API_KEY_HERE"
