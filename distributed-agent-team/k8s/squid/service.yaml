# Squid Proxy Service
# Exposes the proxy at squid-proxy.proxy.svc.cluster.local:3128
---
apiVersion: v1
kind: Service
metadata:
  name: squid-proxy
  namespace: proxy
  labels:
    app: squid-proxy
spec:
  selector:
    app: squid-proxy
  ports:
    - name: http-proxy
      port: 3128
      targetPort: 3128
      protocol: TCP
  type: ClusterIP
