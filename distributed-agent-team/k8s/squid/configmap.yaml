# Squid Proxy Configuration
# Domain-based allowlist for agent pod egress traffic
# The frontend can dynamically update this ConfigMap and reload Squid
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: proxy
  labels:
    app: squid-proxy
data:
  squid.conf: |
    # Squid Proxy Configuration for Distributed Agent Team
    # Only allow traffic to pre-approved domains

    # Define allowed domains (matching init-firewall.sh's ipset)
    acl allowed_domains dstdomain .github.com
    acl allowed_domains dstdomain .githubusercontent.com
    acl allowed_domains dstdomain registry.npmjs.org
    acl allowed_domains dstdomain api.anthropic.com
    acl allowed_domains dstdomain .sentry.io
    acl allowed_domains dstdomain .statsig.com
    acl allowed_domains dstdomain statsig.anthropic.com

    # Additional commonly needed domains for development
    acl allowed_domains dstdomain .pypi.org
    acl allowed_domains dstdomain pypi.org
    acl allowed_domains dstdomain files.pythonhosted.org
    acl allowed_domains dstdomain .npmjs.com

    # Define safe ports
    acl SSL_ports port 443
    acl Safe_ports port 80          # HTTP
    acl Safe_ports port 443         # HTTPS
    acl Safe_ports port 22          # SSH (for git)
    acl CONNECT method CONNECT

    # Access control rules
    # Deny requests to unsafe ports
    http_access deny !Safe_ports

    # Deny CONNECT to non-SSL ports
    http_access deny CONNECT !SSL_ports

    # Allow traffic to permitted domains only
    http_access allow allowed_domains

    # Deny everything else
    http_access deny all

    # Squid listening port
    http_port 3128

    # Logging configuration
    access_log daemon:/var/log/squid/access.log squid
    cache_log /var/log/squid/cache.log

    # Cache configuration (minimal caching for this use case)
    cache_mem 64 MB
    maximum_object_size_in_memory 512 KB
    cache_dir ufs /var/spool/squid 100 16 256
    maximum_object_size 4 MB

    # Timeouts
    connect_timeout 30 seconds
    read_timeout 3 minutes

    # Disable caching for dynamic content
    cache deny all

    # Privacy - don't forward client IP
    forwarded_for delete
    via off

    # PID file location
    pid_filename /var/run/squid/squid.pid

    # Coredump directory
    coredump_dir /var/spool/squid
