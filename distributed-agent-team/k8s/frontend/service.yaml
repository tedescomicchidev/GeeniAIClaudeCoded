# Frontend Service
# Exposes the frontend application
# Use LoadBalancer for cloud deployments, NodePort for minikube
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dmz
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  # For minikube: use NodePort
  # For cloud (AKS/EKS/GKE): use LoadBalancer
  type: LoadBalancer
---
