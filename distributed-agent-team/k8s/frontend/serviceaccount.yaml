# Frontend ServiceAccount and RBAC Configuration
# The frontend needs permission to create/delete pods and services in the agents namespace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: dmz
---
# Role in agents namespace for pod/service management
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-manager-role
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "pods/exec", "pods/log"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
# RoleBinding to grant frontend-sa the agent-manager-role in agents namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-manager-binding
  namespace: agents
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: dmz
roleRef:
  kind: Role
  name: agent-manager-role
  apiGroup: rbac.authorization.k8s.io
---
# Role in proxy namespace for ConfigMap patching (dynamic Squid allowlist updates)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: squid-config-role
  namespace: proxy
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# RoleBinding for squid config management
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squid-config-binding
  namespace: proxy
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: dmz
roleRef:
  kind: Role
  name: squid-config-role
  apiGroup: rbac.authorization.k8s.io
