# Agent secrets - replace with actual values or use external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: agent-platform
type: Opaque
stringData:
  # Anthropic API key for Claude agents
  anthropic-api-key: "${ANTHROPIC_API_KEY}"
  # GitHub token for repository access
  github-token: "${GITHUB_TOKEN}"
  # Azure DevOps PAT (optional)
  ado-pat: "${ADO_PAT}"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: agent-platform-dmz
type: Opaque
stringData:
  anthropic-api-key: "${ANTHROPIC_API_KEY}"
  github-token: "${GITHUB_TOKEN}"
